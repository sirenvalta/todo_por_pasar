<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de JavaScript</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        /* ENCABEZADO */

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 35px 15px;
            border-bottom: 4px solid #777;
        }

        header h1 {
            margin: 0;
            letter-spacing: 2px;
        }

        header p {
            color: #ccc;
            margin-bottom: 0;
        }

        /* CONTENEDOR */

        .contenedor {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h2 {
            border-left: 5px solid #444;
            padding-left: 12px;
            margin-bottom: 25px;
        }

        /* TABLA */

        .tabla-contenedor {
            padding: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        th {
            background-color: #333;
            color: white;
            padding: 16px;
        }

        td {
            background-color: white;
            padding: 16px;
            text-align: center;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        td:first-child {
            border-left: 1px solid #ddd;
            border-radius: 7px 0 0 7px;
        }

        td:last-child {
            border-right: 1px solid #ddd;
            border-radius: 0 7px 7px 0;
        }

        /* ANIMACION DE FILAS */

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            transform: scale(1.015);
            filter: drop-shadow(0 5px 7px rgba(0,0,0,0.18));
        }

        tbody tr:hover td {
            background-color: #e9e9e9;
        }

        /* BOTONES */

        .boton {
            display: inline-block;
            background-color: #555;
            color: white;
            padding: 10px 22px;
            border-radius: 5px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .boton:hover {
            background-color: #222;
            transform: scale(1.08);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .boton:active {
            transform: scale(0.95);
        }

        /* PIE DE PAGINA */

        footer {
            background-color: #222;
            color: #ccc;
            text-align: center;
            padding: 22px;
            margin-top: 40px;
        }

        /* CELULARES */

        @media (max-width: 650px) {

            .contenedor {
                width: 98%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px 5px;
            }

            .boton {
                padding: 8px;
            }

            header h1 {
                font-size: 22px;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>PRACTICAS DE JAVASCRIPT</h1>

        <p>Jordan Jesus Martinez Garnica</p>

    </header>


    <div class="contenedor">

        <h2></h2>

        <div class="tabla-contenedor">

            <table>

                <thead>

                    <tr>
                        <th>Número</th>
                        <th>Nombre del ejercicio</th>
                        <th>Categoría</th>
                        <th>Abrir</th>
                    </tr>

                </thead>

                <tbody id="tabla">

                </tbody>

            </table>

        </div>

    </div>


    <footer>

        <p>PASEME PROFA :C</p>


    </footer>


    <script>

        // LISTA DE EJERCICIOS

        let ejercicios = [

            {nombre: "Anónima", archivo: "anonima.html", categoria: "Funciones"},

            {nombre: "Aprendo JSP", archivo: "aprendojsp.html", categoria: "Otros"},

            {nombre: "Botón", archivo: "boton.html", categoria: "Eventos"},

            {nombre: "Botón D", archivo: "botonD.html", categoria: "Eventos"},

            {nombre: "Ciudadano", archivo: "ciudadano.html", categoria: "Otros"},

            {nombre: "Clase", archivo: "clase.html", categoria: "Clases"},

            {nombre: "Condicional", archivo: "condicional.html", categoria: "Condiciones"},

            {nombre: "Declarada", archivo: "declarada.html", categoria: "Funciones"},

            {nombre: "Declarada D", archivo: "declaradaD.html", categoria: "Funciones"},

            {nombre: "División", archivo: "divicion.html", categoria: "Operaciones"},

            {nombre: "Dos números", archivo: "dosNumerosM.html", categoria: "Operaciones"},

            {nombre: "Estudiante", archivo: "estudiante.html", categoria: "Otros"},

            {nombre: "Evento", archivo: "Fevento.html", categoria: "Eventos"},

            {nombre: "Flecha", archivo: "Flecha.html", categoria: "Funciones"},

            {nombre: "Función recursiva", archivo: "Frecursiva.html", categoria: "Funciones"},

            {nombre: "Imagen Inner", archivo: "imageninner.html", categoria: "HTML"},

            {nombre: "Inner", archivo: "inner.html", categoria: "HTML"},

            {nombre: "Mensaje", archivo: "mensaje.html", categoria: "Eventos"},

            {nombre: "Multiplicación", archivo: "multiplicacion.html", categoria: "Operaciones"},

            {nombre: "Operaciones B", archivo: "operacionesB.html", categoria: "Operaciones"},

            {nombre: "Operaciones BSW", archivo: "operacionesbsw.html", categoria: "Operaciones"},

            {nombre: "Parámetros", archivo: "parametros.html", categoria: "Funciones"},

            {nombre: "Parámetros G", archivo: "parametrosG.html", categoria: "Funciones"},

            {nombre: "Positivo y negativo", archivo: "positivonegativo (1).html", categoria: "Condiciones"},

            {nombre: "Promedio", archivo: "promedio.html", categoria: "Operaciones"},

            {nombre: "Resta", archivo: "resta.html", categoria: "Operaciones"},

            {nombre: "Return", archivo: "return.html", categoria: "Funciones"},

            {nombre: "Semestre", archivo: "semestre.html", categoria: "Otros"},

            {nombre: "Suma", archivo: "suma.html", categoria: "Operaciones"}

        ];


        // MOSTRAR EJERCICIOS EN LA TABLA

        function mostrarEjercicios() {

            let tabla = document.getElementById("tabla");

            tabla.innerHTML = "";

            for (let i = 0; i < ejercicios.length; i++) {

                tabla.innerHTML += `

                    <tr>

                        <td>${i + 1}</td>

                        <td>${ejercicios[i].nombre}</td>

                        <td>${ejercicios[i].categoria}</td>

                        <td>

                            <a class="boton"
                               href="${ejercicios[i].archivo}">

                               Abrir

                            </a>

                        </td>

                    </tr>

                `;

            }

        }


        // INICIAR PAGINA

        mostrarEjercicios();

    </script>

</body>
</html>
