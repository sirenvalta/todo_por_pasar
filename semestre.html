<!DOCTYPE html>
<html lang="en">

<body>
    <script>
let semestre = Number(prompt("Ingresa tu semestre (1, 3 o 5):"));

if (semestre == 5) {
    document.write("Debes entrar al laboratorio 3");
} else if (semestre == 3 || semestre == 1) {
    document.write("Debes entrar al laboratorio 1");
} else {
    document.write("Semestre no válido");
}
    </script>
</body>
</html>
